<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tasks</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #eaf1f8;
            --surface: #f8fbff;
            --surface-muted: #e0eaf4;
            --text: #102a43;
            --muted: #58708a;
            --line: #c7d6e5;
            --accent: #57a9e8;
            --accent-dark: #388bc9;
            --shadow: 0 18px 45px rgba(20, 55, 88, 0.14);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0b1d2d;
            --surface: #122b40;
            --surface-muted: #193b54;
            --text: #edf7ff;
            --muted: #9bb7ca;
            --line: #2b4c63;
            --accent: #83c8f2;
            --accent-dark: #a9ddfb;
            --shadow: 0 18px 45px rgba(2, 13, 24, 0.34);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top right, rgba(87, 169, 232, 0.16), transparent 35%), var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, input { font: inherit; }
        button { cursor: pointer; }

        .app {
            width: min(100% - 32px, 760px);
            margin: 0 auto;
            padding: 52px 0 40px;
        }

        .topbar, .heading, .task-item, .task-main, .task-actions, .stats, .add-form {
            display: flex;
            align-items: center;
        }

        .topbar { justify-content: space-between; margin-bottom: 52px; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; }
        .brand-mark { color: var(--accent); font-size: 1.3rem; }
        .theme-toggle, .icon-button { border: 0; color: var(--muted); background: transparent; }
        .theme-toggle { padding: 8px; border-radius: 999px; font-size: 1.2rem; }
        .theme-toggle:hover, .icon-button:hover { color: var(--text); background: var(--surface-muted); }

        .heading { justify-content: space-between; gap: 20px; margin-bottom: 24px; }
        h1 { margin: 0 0 6px; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.055em; }
        .subtitle { margin: 0; color: var(--muted); }
        .stats { gap: 9px; color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
        .stats strong { color: var(--text); font-size: 1.15rem; }

        .panel { padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
        .add-form { gap: 10px; margin-bottom: 20px; }
        .add-form input, .edit-input {
            width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 8px; outline: 0;
            padding: 12px 14px; color: var(--text); background: var(--surface-muted);
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(87, 169, 232, 0.2); }
        .add-form button {
            border: 0; border-radius: 999px; padding: 12px 20px; color: #082238; background: var(--accent); font-weight: 700;
        }
        .add-form button:hover { color: #061a2b; background: var(--accent-dark); }
        .task-list { display: grid; gap: 9px; }
        .task-item { min-height: 60px; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
        .task-main { flex: 1; min-width: 0; gap: 12px; }
        .task-main span { overflow-wrap: anywhere; }
        .task-item.completed .task-main span { color: var(--muted); text-decoration: line-through; }
        .check { width: 19px; height: 19px; flex: 0 0 auto; accent-color: var(--accent); }
        .task-actions { gap: 2px; }
        .icon-button { width: 38px; height: 38px; border-radius: 999px; font-size: 1rem; }
        .empty { padding: 38px 16px; color: var(--muted); text-align: center; }
        .empty strong { display: block; margin-bottom: 6px; color: var(--text); }

        @media (max-width: 520px) {
            .app { padding-top: 28px; }
            .topbar { margin-bottom: 36px; }
            .heading { align-items: flex-start; flex-direction: column; gap: 10px; }
            .panel { padding: 14px; }
            .add-form { align-items: stretch; flex-direction: column; }
            .add-form button { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div class="brand"><span class="brand-mark">✓</span><span>Daily Tasks</span></div>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">☾</button>
        </header>

        <section class="heading">
            <div>
                <h1>My tasks</h1>
                <p class="subtitle">A clear mind starts with a clear list.</p>
            </div>
            <div class="stats"><strong id="remainingCount">0</strong><span>remaining</span></div>
        </section>

        <section class="panel" aria-label="To-do list">
            <form class="add-form" id="taskForm">
                <input id="taskInput" type="text" placeholder="What needs to be done?" maxlength="120" autocomplete="off" required>
                <button type="submit">Add task</button>
            </form>
            <div class="task-list" id="taskList"></div>
        </section>
    </main>

    <script>
        const STORAGE_KEY = "daily-tasks";
        const THEME_KEY = "daily-tasks-theme";
        const taskForm = document.querySelector("#taskForm");
        const taskInput = document.querySelector("#taskInput");
        const taskList = document.querySelector("#taskList");
        const remainingCount = document.querySelector("#remainingCount");
        const themeToggle = document.querySelector("#themeToggle");
        let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function renderTasks() {
            taskList.replaceChildren();
            const remaining = tasks.filter((task) => !task.completed).length;
            remainingCount.textContent = remaining;

            if (!tasks.length) {
                taskList.innerHTML = '<div class="empty"><strong>Your list is clear.</strong>Add a task to get started.</div>';
                return;
            }

            tasks.forEach((task) => {
                const item = document.createElement("div");
                item.className = `task-item${task.completed ? " completed" : ""}`;
                item.dataset.id = task.id;
                item.innerHTML = `
                    <label class="task-main">
                        <input class="check" type="checkbox" ${task.completed ? "checked" : ""} aria-label="Mark task complete">
                        <span>${escapeHtml(task.text)}</span>
                    </label>
                    <div class="task-actions">
                        <button class="icon-button edit-button" type="button" aria-label="Edit task">✎</button>
                        <button class="icon-button delete-button" type="button" aria-label="Delete task">×</button>
                    </div>`;
                taskList.append(item);
            });
        }

        function escapeHtml(value) {
            return value.replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[character]));
        }

        taskForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const text = taskInput.value.trim();
            if (!text) return;
            tasks.unshift({ id: Date.now().toString(), text, completed: false });
            saveTasks();
            renderTasks();
            taskInput.value = "";
            taskInput.focus();
        });

        taskList.addEventListener("click", (event) => {
            const item = event.target.closest(".task-item");
            if (!item) return;
            const task = tasks.find((entry) => entry.id === item.dataset.id);
            if (event.target.closest(".delete-button")) {
                tasks = tasks.filter((entry) => entry.id !== task.id);
            } else if (event.target.closest(".edit-button")) {
                const input = document.createElement("input");
                input.className = "edit-input";
                input.value = task.text;
                item.querySelector(".task-main").replaceChildren(input);
                input.focus();
                input.select();
                input.addEventListener("keydown", (keyEvent) => { if (keyEvent.key === "Enter") input.blur(); });
                input.addEventListener("blur", () => {
                    const text = input.value.trim();
                    if (text) task.text = text;
                    saveTasks();
                    renderTasks();
                }, { once: true });
                return;
            } else {
                return;
            }
            saveTasks();
            renderTasks();
        });

        taskList.addEventListener("change", (event) => {
            if (!event.target.classList.contains("check")) return;
            const item = event.target.closest(".task-item");
            const task = tasks.find((entry) => entry.id === item.dataset.id);
            task.completed = event.target.checked;
            saveTasks();
            renderTasks();
        });

        function setTheme(theme) {
            document.documentElement.dataset.theme = theme;
            localStorage.setItem(THEME_KEY, theme);
            themeToggle.textContent = theme === "dark" ? "☀" : "☾";
            themeToggle.setAttribute("aria-label", `Switch to ${theme === "dark" ? "light" : "dark"} mode`);
        }

        themeToggle.addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
        setTheme(localStorage.getItem(THEME_KEY) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
        renderTasks();
    </script>
</body>
</html>
