<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        :root { color-scheme: dark; --bg: #081a2a; --surface: #102b41; --raised: #173a54; --soft: #123149; --text: #edf7ff; --muted: #9eb8cb; --line: #2a4c64; --accent: #83c8f2; --accent-strong: #b0e0fb; --accent-text: #082238; --danger: #ff9b9b; --shadow: 0 24px 60px rgba(1, 10, 19, .35); }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 85% 0%, rgba(83, 167, 221, .18), transparent 32%), var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        button { border: 0; cursor: pointer; font: inherit; }
        button:focus-visible { outline: 3px solid rgba(131, 200, 242, .55); outline-offset: 2px; }
        .app { width: min(100% - 32px, 1040px); margin: 0 auto; padding: 42px 0; }
        .header { margin-bottom: 26px; }
        .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: .8rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.1rem); letter-spacing: -.05em; }
        .calculator-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(230px, .65fr); gap: 18px; }
        .calculator, .history { border: 1px solid var(--line); border-radius: 18px; background: rgba(16, 43, 65, .92); box-shadow: var(--shadow); }
        .calculator { padding: 20px; }
        .display { min-height: 116px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: 10px; padding: 18px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 12px; background: #071724; overflow: hidden; }
        .expression, .result { width: 100%; overflow-wrap: anywhere; text-align: right; }
        .expression { min-height: 25px; color: var(--muted); font-size: 1rem; }
        .result { color: var(--text); font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; letter-spacing: -.04em; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
        .mode-toggle, .memory { display: flex; gap: 5px; }
        .toolbar button { min-height: 34px; padding: 7px 12px; border-radius: 999px; color: var(--muted); background: var(--soft); font-size: .8rem; font-weight: 700; }
        .toolbar button.active, .toolbar button:hover { color: var(--accent-text); background: var(--accent); }
        .keypad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 9px; }
        .key { min-height: 54px; border-radius: 11px; color: var(--text); background: var(--raised); font-size: 1rem; font-weight: 650; transition: background 120ms ease, transform 120ms ease; }
        .key:hover { background: #20516f; }
        .key:active { transform: scale(.97); }
        .key.function { color: var(--accent); background: var(--soft); font-size: .92rem; }
        .key.function:hover { background: #1a4763; }
        .key.operator { color: var(--accent-strong); background: #1b4863; font-size: 1.3rem; }
        .key.equals { color: var(--accent-text); background: var(--accent); font-size: 1.35rem; }
        .key.equals:hover { background: var(--accent-strong); }
        .key.clear { color: var(--danger); }
        .history { min-height: 100%; padding: 20px; }
        .history-heading { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 14px; }
        h2 { margin: 0; font-size: 1rem; }
        .clear-history { padding: 5px 8px; border-radius: 7px; color: var(--muted); background: transparent; font-size: .75rem; }
        .clear-history:hover { color: var(--text); background: var(--soft); }
        .history-list { display: grid; gap: 4px; }
        .history-item { width: 100%; padding: 10px 8px; border-bottom: 1px solid var(--line); color: var(--text); background: transparent; text-align: right; cursor: pointer; }
        .history-item:hover { background: var(--soft); }
        .history-expression { display: block; margin-bottom: 3px; color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
        .history-result { font-weight: 700; overflow-wrap: anywhere; }
        .empty-history { padding: 24px 8px; color: var(--muted); font-size: .85rem; line-height: 1.5; text-align: center; }
        @media (max-width: 720px) { .app { padding-top: 28px; } .calculator-layout { grid-template-columns: 1fr; } .history { min-height: auto; } }
        @media (max-width: 480px) { .app { width: min(100% - 20px, 1040px); } .calculator, .history { padding: 14px; border-radius: 14px; } .keypad { gap: 6px; } .key { min-height: 48px; font-size: .9rem; } .key.function { font-size: .78rem; } .toolbar { align-items: flex-start; flex-direction: column; } }
    </style>
</head>
<body>
    <main class="app">
        <header class="header"><p class="eyebrow">Precision tool</p><h1>Scientific calculator</h1></header>
        <div class="calculator-layout">
            <section class="calculator" aria-label="Scientific calculator">
                <div class="display" aria-live="polite"><div class="expression" id="expression">Ready</div><div class="result" id="result">0</div></div>
                <div class="toolbar">
                    <div class="mode-toggle" aria-label="Angle mode"><button type="button" data-mode="DEG" class="active">DEG</button><button type="button" data-mode="RAD">RAD</button></div>
                    <div class="memory" aria-label="Memory controls"><button type="button" data-action="memory-clear">MC</button><button type="button" data-action="memory-recall">MR</button><button type="button" data-action="memory-add">M+</button><button type="button" data-action="memory-subtract">M−</button></div>
                </div>
                <div class="keypad">
                    <button class="key function" data-value="sin(" type="button">sin</button><button class="key function" data-value="cos(" type="button">cos</button><button class="key function" data-value="tan(" type="button">tan</button><button class="key function" data-value="log(" type="button">log</button><button class="key function" data-value="ln(" type="button">ln</button><button class="key function" data-value="sqrt(" type="button">√</button>
                    <button class="key function" data-value="asin(" type="button">sin⁻¹</button><button class="key function" data-value="acos(" type="button">cos⁻¹</button><button class="key function" data-value="atan(" type="button">tan⁻¹</button><button class="key function" data-value="^2" type="button">x²</button><button class="key function" data-value="^" type="button">xʸ</button><button class="key function" data-value="!" type="button">x!</button>
                    <button class="key clear" data-action="clear" type="button">AC</button><button class="key" data-action="backspace" type="button">⌫</button><button class="key" data-value="(" type="button">(</button><button class="key" data-value=")" type="button">)</button><button class="key" data-value="%" type="button">%</button><button class="key operator" data-value="/" type="button">÷</button>
                    <button class="key" data-value="7" type="button">7</button><button class="key" data-value="8" type="button">8</button><button class="key" data-value="9" type="button">9</button><button class="key operator" data-value="*" type="button">×</button><button class="key" data-value="π" type="button">π</button><button class="key" data-value="e" type="button">e</button>
                    <button class="key" data-value="4" type="button">4</button><button class="key" data-value="5" type="button">5</button><button class="key" data-value="6" type="button">6</button><button class="key operator" data-value="-" type="button">−</button><button class="key" data-value="." type="button">.</button><button class="key" data-action="sign" type="button">±</button>
                    <button class="key" data-value="1" type="button">1</button><button class="key" data-value="2" type="button">2</button><button class="key" data-value="3" type="button">3</button><button class="key operator" data-value="+" type="button">+</button><button class="key" data-value="0" type="button">0</button><button class="key" data-action="answer" type="button">ANS</button>
                    <button class="key equals" data-action="calculate" type="button">=</button>
                </div>
            </section>
            <aside class="history"><div class="history-heading"><h2>History</h2><button class="clear-history" id="clearHistory" type="button">Clear</button></div><div class="history-list" id="historyList"></div></aside>
        </div>
    </main>
    <script>
        const expressionElement = document.querySelector("#expression");
        const resultElement = document.querySelector("#result");
        const keypad = document.querySelector(".keypad");
        const historyList = document.querySelector("#historyList");
        let expression = "";
        let answer = 0;
        let memory = 0;
        let angleMode = "DEG";
        let history = JSON.parse(localStorage.getItem("calculator-history") || "[]");

        function formatNumber(value) { if (!Number.isFinite(value)) throw new Error("Math error"); return Number(value.toPrecision(12)).toString(); }
        function toRadians(value) { return angleMode === "DEG" ? value * Math.PI / 180 : value; }
        function fromRadians(value) { return angleMode === "DEG" ? value * 180 / Math.PI : value; }
        function factorial(value) { if (value < 0 || !Number.isInteger(value) || value > 170) throw new Error("Invalid factorial"); let result = 1; for (let index = 2; index <= value; index += 1) result *= index; return result; }
        function evaluate(value) {
            let safe = value.replaceAll("π", "PI").replaceAll("^", "**").replaceAll("%", "/100");
            safe = safe.replace(/(\d+(?:\.\d+)?)!/g, "fact($1)");
            if (!/^[0-9+*/().,\sA-Za-z_\-]+$/.test(safe) || /(?:document|window|localStorage|constructor|prototype|function)/i.test(safe)) throw new Error("Invalid expression");
            const scope = { PI: Math.PI, e: Math.E, fact: factorial, sin: (number) => Math.sin(toRadians(number)), cos: (number) => Math.cos(toRadians(number)), tan: (number) => Math.tan(toRadians(number)), asin: (number) => fromRadians(Math.asin(number)), acos: (number) => fromRadians(Math.acos(number)), atan: (number) => fromRadians(Math.atan(number)), log: Math.log10, ln: Math.log, sqrt: Math.sqrt };
            return Function(...Object.keys(scope), `"use strict"; return (${safe})`)(...Object.values(scope));
        }
        function updateDisplay() { expressionElement.textContent = expression || "Ready"; resultElement.textContent = expression ? "" : formatNumber(answer); }
        function addToExpression(value) { expression += value; updateDisplay(); }
        function calculate() {
            if (!expression) return;
            try { const value = evaluate(expression); answer = value; resultElement.textContent = formatNumber(value); history.unshift({ expression, result: formatNumber(value) }); history = history.slice(0, 8); localStorage.setItem("calculator-history", JSON.stringify(history)); renderHistory(); }
            catch (error) { resultElement.textContent = "Error"; }
        }
        function escapeHtml(value) { return value.replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[character])); }
        function renderHistory() {
            historyList.replaceChildren();
            if (!history.length) { historyList.innerHTML = '<div class="empty-history">Your calculations will appear here.</div>'; return; }
            history.forEach((entry) => { const item = document.createElement("button"); item.className = "history-item"; item.type = "button"; item.innerHTML = `<span class="history-expression">${escapeHtml(entry.expression)}</span><span class="history-result">= ${escapeHtml(entry.result)}</span>`; item.addEventListener("click", () => { expression = entry.expression; updateDisplay(); }); historyList.append(item); });
        }
        keypad.addEventListener("click", (event) => {
            const button = event.target.closest("button"); if (!button) return;
            const { action, value } = button.dataset;
            if (value) addToExpression(value);
            if (action === "clear") { expression = ""; updateDisplay(); }
            if (action === "backspace") { expression = expression.slice(0, -1); updateDisplay(); }
            if (action === "answer") addToExpression(formatNumber(answer));
            if (action === "sign") { expression = expression ? `-(${expression})` : "-"; updateDisplay(); }
            if (action === "calculate") calculate();
            if (action === "memory-clear") memory = 0;
            if (action === "memory-recall") addToExpression(formatNumber(memory));
            if (action === "memory-add" || action === "memory-subtract") { try { memory += (action === "memory-add" ? 1 : -1) * (expression ? evaluate(expression) : answer); } catch (error) { resultElement.textContent = "Error"; } }
        });
        document.querySelectorAll("[data-mode]").forEach((button) => button.addEventListener("click", () => { angleMode = button.dataset.mode; document.querySelectorAll("[data-mode]").forEach((modeButton) => modeButton.classList.toggle("active", modeButton === button)); }));
        document.querySelector("#clearHistory").addEventListener("click", () => { history = []; localStorage.removeItem("calculator-history"); renderHistory(); });
        document.addEventListener("keydown", (event) => { if (/^[0-9.+\-*/()%]$/.test(event.key)) addToExpression(event.key); if (event.key === "Enter" || event.key === "=") calculate(); if (event.key === "Backspace") { expression = expression.slice(0, -1); updateDisplay(); } if (event.key === "Escape") { expression = ""; updateDisplay(); } });
        renderHistory();
        updateDisplay();
    </script>
</body>
</html>
